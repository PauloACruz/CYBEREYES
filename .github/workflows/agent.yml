name: Agente EYES

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"

permissions:
  contents: read

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Arquivos fora do gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet (linux, windows, darwin)
        run: |
          for os in linux windows darwin; do
            echo "== GOOS=$os"
            GOOS=$os go vet ./...
            GOOS=$os go vet -tags smoke ./smoke/...
          done
      # Tela X11 virtual para os testes de captura, entrada e area de transferencia do acesso remoto.
      - name: Xvfb, xdotool e xclip
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xdotool xclip
          Xvfb :99 -screen 0 1280x800x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - run: go test ./...
      - name: build.sh (todas as plataformas)
        run: ./build.sh "$RUNNER_TEMP/dist"

  # App de bandeja (eyes-tray): interface, Go (Linux com GTK 3/WebKit2GTK 4.1 e Windows) e os binarios
  # que a imagem da API distribui. O --version confere que o binario do Linux carrega as bibliotecas.
  tray:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/tray
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/tray/frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/tray/go.mod
          cache-dependency-path: agent/tray/go.sum
      - name: Bibliotecas GTK 3 e WebKit2GTK 4.1
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Interface (lint, tipos, testes e build)
        working-directory: agent/tray/frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: gofmt
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "::error::Arquivos fora do gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet (linux gtk3 e windows)
        run: |
          go vet -tags gtk3 ./...
          GOOS=windows go vet ./...
      - run: go test ./internal/...
      - name: Build Linux e Windows
        run: |
          ./build-linux.sh "$RUNNER_TEMP/dist"
          "$RUNNER_TEMP"/dist/eyes-tray-v*-linux-amd64 --version
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H=windowsgui -s -w" -o "$RUNNER_TEMP/dist/eyes-tray.exe" .

  # Teste de fumaca: compila o EYES, sobe NATS e REST falsos e confere o agente real.
  # TestService instala o servico de verdade (exige administrador/root).
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      EYES_SMOKE_SERVICE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Baixar modulos
        run: go mod download
      - name: Smoke (Linux e macOS, como root)
        if: runner.os != 'Windows'
        # O sudo troca o PATH (secure_path): repassa o PATH e os caches do Go do usuario.
        run: |
          sudo -E env "PATH=$PATH" "HOME=$HOME" \
            "GOPATH=$(go env GOPATH)" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" \
            EYES_SMOKE_SERVICE=1 \
            go test -count=1 -tags smoke -v -timeout 20m ./smoke/...
      - name: Smoke (Windows, administrador)
        if: runner.os == 'Windows'
        run: go test -count=1 -tags smoke -v -timeout 20m ./smoke/...
      # Captura do acesso remoto no Windows (DXGI Desktop Duplication e GDI) na area de trabalho do runner.
      - name: Captura de tela (Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 -v -run 'TestWindowsGrab|TestDXGIMatchesGDI' ./internal/remote/capture/
