name: cybereyes

x-restart: &restart
  restart: unless-stopped

# Hardening comum (ADR-018): sem escalada de privilegio e sem capacidades do kernel;
# cada servico devolve so as capacidades que precisa com cap_add.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Rotacao dos logs dos conteineres (o json-file padrao do Docker cresce sem limite).
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  nginx:
    <<: [*restart, *hardening]
    build: ./nginx
    # Mestre como root: troca para o usuario nginx nos workers e le certificados proprios em certs/
    # mesmo quando a chave privada pertence a outro usuario do host (DAC_READ_SEARCH, so leitura).
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_READ_SEARCH]
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
      - /etc/nginx/conf.d
      - /etc/nginx/certs
      - /etc/nginx/selfsigned
    mem_limit: 256m
    image: ${REGISTRY:-ghcr.io/pauloacruz}/cybereyes-nginx:${VERSION:-latest}
    ports:
      - "80:80"
      - "443:443"
    environment:
      CYBEREYES_HOST: ${CYBEREYES_HOST:?defina CYBEREYES_HOST no .env}
      MESH_HOST: ${MESH_HOST}
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      - ./certs:/etc/nginx/custom-certs:ro
    healthcheck:
      test: ["CMD", "nginx", "-t", "-q"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      edge:
        ipv4_address: 172.30.0.10
        aliases:
          - ${MESH_HOST}

  certbot:
    <<: [*restart, *hardening]
    image: certbot/certbot:v5.8.0
    mem_limit: 256m
    entrypoint: ["/bin/sh", "/run.sh"]
    environment:
      CYBEREYES_HOST: ${CYBEREYES_HOST}
      MESH_HOST: ${MESH_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./certbot/run.sh:/run.sh:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on:
      - nginx
    networks: [edge]
    profiles: [letsencrypt]

  migrate:
    <<: *hardening
    image: ${REGISTRY:-ghcr.io/pauloacruz}/cybereyes-api:${VERSION:-latest}
    build: ../../backend
    command: ["--migrate-only"]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    environment:
      ConnectionStrings__Default: Host=postgres;Database=cybereyes;Username=cybereyes;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Seed__AdminUsername: ${ADMIN_USERNAME}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
      Seed__AdminEmail: ${ADMIN_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    restart: "no"

  api:
    <<: [*restart, *hardening]
    image: ${REGISTRY:-ghcr.io/pauloacruz}/cybereyes-api:${VERSION:-latest}
    build: ../../backend
    deploy:
      replicas: ${API_REPLICAS:-2}
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 1g
    environment:
      ConnectionStrings__Default: Host=postgres;Database=cybereyes;Username=cybereyes;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Proxy__TrustAll: "true"
      Database__MigrateOnStartup: "false"
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      App__PublicUrl: https://${CYBEREYES_HOST}
      Nats__Url: nats://nats:4222
      Nats__User: ${NATS_API_USER}
      Nats__Password: ${NATS_API_PASSWORD}
      Nats__AuthFile: /etc/nats/auth/users.conf
      Agent__BinariesPath: /agents
      Agent__LatestVersion: ${AGENT_VERSION:-2.11.0}
      Mesh__Url: https://${MESH_HOST}
      Mesh__InternalUrl: http://meshcentral:4443
      Mesh__Username: ${MESH_USER:-cybereyes}
      Mesh__TokenKeyFile: /mesh/mesh_token
      Mesh__DeviceGroup: ${MESH_DEVICE_GROUP:-Cybereyes}
      Vault__Key: ${VAULT_KEY:-}
    volumes:
      - nats_auth:/etc/nats/auth
      - ./agents:/agents:ro
      - mesh_shared:/mesh:ro
    depends_on:
      nats:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [edge, data]

  web:
    <<: [*restart, *hardening]
    image: ${REGISTRY:-ghcr.io/pauloacruz}/cybereyes-web:${VERSION:-latest}
    build:
      context: ../../frontend
      args:
        APP_COMMIT: ${APP_COMMIT:-dev}
    cap_add: [CHOWN, SETUID, SETGID]
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
    mem_limit: 128m
    networks: [edge]

  postgres:
    <<: [*restart, *hardening]
    image: postgres:17-alpine
    # Usuario postgres da imagem alpine (uid 70); dispensa o chown/gosu do entrypoint.
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70
    mem_limit: 1536m
    environment:
      POSTGRES_DB: cybereyes
      POSTGRES_USER: cybereyes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybereyes -d cybereyes"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]

  redis:
    <<: [*restart, *hardening]
    image: redis:7.4-alpine
    # Usuario redis da imagem (uid 999). A senha vem do ambiente para nao aparecer na configuracao do conteiner.
    user: "999:1000"
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks: [data]

  nats:
    <<: [*restart, *hardening]
    image: nats:2.11-alpine
    entrypoint: ["/bin/sh", "/run.sh"]
    # run.sh roda como root para entregar o arquivo de usuarios a API (uid 1654) e ler esse arquivo depois.
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    read_only: true
    mem_limit: 512m
    environment:
      NATS_API_USER: ${NATS_API_USER}
      NATS_API_PASSWORD: ${NATS_API_PASSWORD}
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - ./nats/run.sh:/run.sh:ro
      - nats_auth:/etc/nats/auth
    networks: [edge, data]

  meshcentral:
    <<: [*restart, *hardening]
    mem_limit: 1g
    build:
      context: ./meshcentral
      args:
        MESHCENTRAL_VERSION: ${MESHCENTRAL_VERSION:-1.2.5}
    image: ${REGISTRY:-ghcr.io/pauloacruz}/cybereyes-meshcentral:${MESHCENTRAL_VERSION:-1.2.5}
    environment:
      MESH_HOST: ${MESH_HOST}
      PROXY_IP: 172.30.0.10
      MESH_USER: ${MESH_USER:-cybereyes}
      MESH_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - mesh_data:/opt/meshcentral/meshcentral-data
      - mesh_files:/opt/meshcentral/meshcentral-files
      - mesh_shared:/opt/meshcentral/shared
    networks: [edge]

  # Backup diario (sempre ativo, sem perfil: o RPO de 24 h depende dele e um perfil esquecido
  # no .env desligaria o backup sem aviso). Ver docs/runbooks/backup-restauracao.md.
  backup:
    <<: [*restart, *hardening]
    build: ./backup
    image: ${REGISTRY:-ghcr.io/pauloacruz}/cybereyes-backup:${VERSION:-latest}
    # Root com DAC_READ_SEARCH apenas para ler os arquivos do MeshCentral (uid 1000) nos volumes somente leitura.
    cap_add: [DAC_READ_SEARCH]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      PGHOST: postgres
      PGUSER: cybereyes
      PGDATABASE: cybereyes
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_INCLUDE_ENV: ${BACKUP_INCLUDE_ENV:-false}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - mesh_data:/volumes/mesh_data:ro
      - mesh_files:/volumes/mesh_files:ro
      - ./.env:/config/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  data:
    internal: true

volumes:
  nats_auth:
  letsencrypt:
  certbot_webroot:
  postgres_data:
  redis_data:
  mesh_data:
  mesh_files:
  mesh_shared:
